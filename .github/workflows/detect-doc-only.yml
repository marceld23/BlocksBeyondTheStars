# Reusable doc/asset-only change detector, shared by ci.yml, lint.yml and codeql.yml.
#
# Output `nondocs` is "true" when the PR diff contains ANY file that is not documentation, an
# image (marketing screenshot, texture, icon, …) or standalone external-service tooling. Callers
# gate their heavy jobs on it, so a PR that only touches Markdown/docs/licences, image files or
# the website tooling under tools/ skips build, tests, format, lint and CodeQL.
# Because each of those is a job-name required check, a *skipped* required job still counts as a pass,
# so doc/screenshot-only PRs stay green and are never blocked. (CodeQL is handled separately: its
# required check is posted by the code-scanning service, not the job, so it is gated here AND removed
# from main's required checks — see codeql.yml.)
#
# Only meaningful for pull_request events. On push/schedule the detection step is skipped and
# `nondocs` stays empty; callers run unconditionally via `github.event_name != 'pull_request'`.
#
# IMPORTANT: this is the SINGLE SOURCE OF TRUTH for the doc/image skip list. To change what counts as
# doc-only, edit the `case` below here — do not re-add per-workflow copies. `data/**` is
# deliberately NOT skipped: it feeds the headless tests (e.g. the en/de locale-parity test).
#
# Second output `lane` (#922, widened for the What's-new feed): which test gate the PR needs.
#   docs     — nothing but documentation/images (`nondocs` is false)
#   locales  — every non-doc file is under data/locales/
#   whatsnew — every non-doc file is data/whatsnew.json or under data-online/whatsnew/
#   full     — anything else, INCLUDING a diff that mixes locales and What's-new files
# On `locales` and `whatsnew` ci.yml replaces the sharded matrix with the narrow `lane-tests` job,
# because only a known handful of test classes can observe such a change (see ci.yml's NARROW
# LANES header for why that is safe). `nondocs` stays true on both — lint.yml and codeql.yml are
# unaffected and keep running. A new narrow lane is one more `case` arm and one more value here,
# plus its filter in ci.yml's `lane-tests`; an unknown value there fails the job rather than
# running nothing.
name: Detect doc-only changes

on:
  workflow_call:
    outputs:
      nondocs:
        description: "true if the PR diff contains any non-doc, non-image file"
        value: ${{ jobs.detect.outputs.nondocs }}
      lane:
        description: "docs | locales | whatsnew | full — the test gate this PR diff needs (empty outside pull requests)"
        value: ${{ jobs.detect.outputs.lane }}

permissions:
  contents: read

jobs:
  detect:
    name: Detect code changes
    runs-on: ubuntu-latest
    outputs:
      nondocs: ${{ steps.detect.outputs.nondocs }}
      lane: ${{ steps.detect.outputs.lane }}
    steps:
      # Lists the PR's changed files via the API (no checkout needed) and sets nondocs=true if ANY file
      # is neither documentation nor an image. (Explicit case match rather than dorny/paths-filter, whose
      # `some` glob semantics made a `**/*` + `!doc` list always true.)
      # A renamed file counts under BOTH its paths (the API lists a rename once, new name in
      # `filename`, old one in `previous_filename`): moving a content file into docs/ or into a
      # narrow lane's folder takes it away from the code that read it, which is a code change.
      - name: Detect non-doc changes
        id: detect
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files="$(gh api --paginate "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" --jq '.[] | .filename, (.previous_filename // empty)')"
          haslocales=false
          haswhatsnew=false
          hascode=false
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              # Documentation
              *.md|docs/*|LICENSE*|NOTICES*|THIRD-PARTY*|.github/ISSUE_TEMPLATE/*|.github/pull_request_template.md) ;;
              # Images (screenshots, textures, icons) — none affect the .NET tests, ruff,
              # actionlint or CodeQL analysis, so an image-only change is safe to skip everywhere.
              *.png|*.jpg|*.jpeg|*.gif|*.webp|*.bmp|*.svg|*.ico) ;;
              # Standalone external-service tooling (website devblog, Wix i18n, glitch.fun store
              # media) — pure Python scripts talking to external APIs, not part of the game build
              # and not imported by any test. Push-to-main runs (ruff, CodeQL) still cover them
              # because detection only applies to pull_request events.
              tools/devblog/*|tools/wix-i18n/*|tools/glitch-media/*) ;;
              # Locale tables: non-doc (they feed the headless tests), but when the WHOLE diff
              # stays inside data/locales/ the caller may narrow the test matrix (see header).
              data/locales/*) haslocales=true ;;
              # The in-game "What's new?" feed and its per-language files: non-doc as well (a
              # content test guards their shape), but nothing else reads them — the game server
              # never loads either. Deliberately narrow — the feed itself and the JSON files
              # directly in the whatsnew folder: a `*` in a `case` pattern crosses slashes, so
              # the first arm sends anything nested deeper to the full matrix, as does any
              # other file type there and any future kind of online content.
              data-online/whatsnew/*/*) hascode=true; break ;;
              data/whatsnew.json|data-online/whatsnew/*.json) haswhatsnew=true ;;
              *) hascode=true; break ;;
            esac
          done <<< "$files"
          # A diff that mixes the two narrow groups takes the full matrix: the lanes are not
          # combined (rare, and a union of two filters is one more path that can under-select).
          nondocs=true
          if [ "$hascode" = true ]; then
            lane=full
          elif [ "$haslocales" = true ] && [ "$haswhatsnew" = true ]; then
            lane=full
          elif [ "$haslocales" = true ]; then
            lane=locales
          elif [ "$haswhatsnew" = true ]; then
            lane=whatsnew
          else
            lane=docs
            nondocs=false
          fi
          echo "nondocs=$nondocs" >> "$GITHUB_OUTPUT"
          echo "lane=$lane" >> "$GITHUB_OUTPUT"
          echo "Changed files:"; printf '%s\n' "$files"; echo "nondocs=$nondocs lane=$lane"
