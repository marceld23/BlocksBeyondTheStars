# Fast pull-request gate: builds the .NET projects and runs the headless xUnit suites.
#
# Triggered on every pull request and on direct pushes to main — NOT by tags (that is release.yml).
# This never touches Unity: it builds and tests only the two headless suites that run on Linux —
#   tests/BlocksBeyondTheStars.Tests        (.NET server/shared xUnit, no Unity)
#   tests/BlocksBeyondTheStars.Client.Tests (real NetworkClient vs in-process GameServer, no Unity/sockets)
# The Unity Edit/PlayMode suites need the editor and stay opt-in/local (see scripts/run-tests.ps1).
#
# TWO-TIER TEST GATE: pull requests run only the fast tier (--filter Category!=Slow); pushes to main run
# the full suite, and release.yml re-runs the full suite on the tagged commit before publishing anything.
# So a PR check stays fast, while every commit that lands on main — and every release — is still covered
# by all tests. Two things keep the fast tier fast (it once decayed from ~6 to ~15 min unnoticed):
#   * tests build/run in Release (worldgen/sim tests are CPU-bound and much faster than in Debug), and
#   * a duration guardrail (scripts/check-test-durations.py) fails a PR when any non-Slow test exceeds
#     its budget, so new heavies must either get the Slow trait or a real fix.
# See the Test step in tests.yml for details.
#
# SHARDED TEST MATRIX (#716): the server suite is CPU-bound and already scales ~perfectly with cores
# (at maxParallelThreads 4 on the 4-vCPU runner the summed test time IS the ~11 min wall the PR gate
# used to spend). More in-process threads would gain nothing (no more cores; xunit.runner.json pins 4
# because of the WorldGenerator lock convoy, #536) — so the suite fans out over 12 runners instead
# (six until 2026-10-09, ten until 2026-11-14; the fast tier was ~21 300 test-seconds then and ~27 900 on
# 2026-11-24), a test step of ~10–11 min per shard.
# The matrix itself lives in the reusable .github/workflows/tests.yml
# (#1067) — shared with release.yml's gate, so the two cannot drift — and is called by `build-test`
# below with the tier/-warnaserror/guardrail settings this workflow wants. Branch protection requires
# the `tests-passed` fan-in job, NOT the matrix jobs (matrix job names carry the shard index and a
# skipped required matrix would not report).
#
# Warnings ARE enforced here: the build runs with -warnaserror so any analyzer/compiler warning fails
# the PR, even though the local build keeps TreatWarningsAsErrors=false (Directory.Build.props) for a
# friction-free dev loop. The tree currently builds clean (0 warnings), so this only guards regressions.
#
# REQUIRED-CHECK SAFE doc/screenshot-only skip: rather than skipping the whole workflow with paths-ignore
# (which would leave a *required* check stuck on "Expected — Waiting for status" for a docs-only PR), the
# workflow always runs and a `changes` job decides whether the heavy `build-test`/`format` jobs run. On a
# doc- or image-only PR the build-test shards are skipped via their `if:`, and the `tests-passed` fan-in
# explicitly treats "changes succeeded + build-test skipped" as a pass — so the required check reports
# green and never blocks a docs PR. Any code/content file in the diff makes them run for real. The
# doc/image skip list lives in the shared reusable workflow .github/workflows/detect-doc-only.yml (also
# used by lint.yml and codeql.yml). The `format` job stays a directly-required check (its name is stable
# and GitHub counts its skip as a pass, as before).
#
# NARROW LANES (#922): when the whole non-doc diff of a PR stays inside a small set of files that only
# a known set of test classes can observe, the sharded matrix is skipped and the `lane-tests` job runs
# exactly those classes (`format` is skipped too where the diff cannot hold C# of the solution).
# detect-doc-only.yml names the lane:
#   * locales  — nothing but data/locales/*.json (a translation PR). The classes come from
#     scripts/locale-test-filter.py: a marker scan for direct locale-table readers plus hand-listed
#     indirect consumers, found by mutating every locale value and collecting the failing classes.
#   * whatsnew — nothing but data/whatsnew.json and data-online/whatsnew/*.json (the release PR's
#     "What's new?" entry and the release notes in the community languages — two PRs per release).
#     The game server loads neither file (the content loader reads named files and sub-folders of
#     data/, never the folder itself), so only the tests that open them can notice:
#     scripts/lane-test-filter.py, a marker scan checked by overwriting the files with invalid
#     content and collecting the failing classes.
#   * client   — nothing but the client side: client/**, src/BlocksBeyondTheStars.Client.Core/**,
#     tests/BlocksBeyondTheStars.Client.Tests/** and the code-health baseline. The server test
#     project does not reference Client.Core, so its binary is the one main already tested; a
#     server test can only notice by reading repository files. `lane-tests` runs every server class
#     that reads anything outside data/ (same script: a marker for each route to the repository
#     root, a rule for helper files, and a check of the project graph), `lane-client-tests` runs the
#     WHOLE Client.Tests suite beside it, and `format` runs as usual (the diff can hold C# of the
#     solution). Not checked by a corruption run. Unity itself is not built here, as on every PR.
# `tests-passed` requires the lane jobs' success on such a PR, and they fail rather than pass on an
# unknown lane or on a filter that matched no test. Safety: an under-selected filter cannot reach
# a release — the push to main after merge runs the COMPLETE suite, and release.yml re-runs it on
# the tagged commit; the worst case is a red main.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the same PR/branch cancels the older still-running check.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Hang detection for every `dotnet test` this workflow runs itself (#3792; the matrix has its own copy in tests.yml). A test that never returns used to
# keep its job running until someone cancelled it by hand (no limit but GitHub's six hours), and a
# cancelled job leaves no log - the hanging test stayed unknown. With these flags the run aborts once
# NO test has started or finished for 15 minutes (an inactivity timer, so a long shard is fine and a
# test that is merely billed for queue time is too), fails the step, and the log names the test:
# "The test running when the crash occurred: <name>". No memory dump (`none`): the name is what is
# needed, and a dump of the test host would fill the runner's disk and the artifact.
env:
  BLAME_HANG: --blame-hang --blame-hang-timeout 15m --blame-hang-dump-type none

jobs:
  # Decides whether the PR diff contains anything other than documentation or images. Always runs (no
  # job-level `if:`) so that on a push to main it succeeds and the downstream `needs: changes` is met;
  # the detection itself is PR-only (see the reusable workflow). `nondocs` is consumed by build-test/format.
  changes:
    uses: ./.github/workflows/detect-doc-only.yml

  # The sharded matrix (reusable tests.yml, see header). Two-tier gate: pull requests run only the fast
  # tier (--filter Category!=Slow, packed on the fast-tier weights) plus the duration guardrail; a push
  # to main runs the COMPLETE suite (tier full). Both build with -warnaserror; the NuGet cache is on
  # because this is the job a human waits on (#531). The job id stays `build-test` — `tests-passed`
  # reads `needs.build-test.result`.
  build-test:
    name: Build + test
    needs: changes
    # Run for any push to main, or for a PR that touched at least one non-doc file. A docs-only PR
    # skips this job; the `tests-passed` fan-in treats that as passing, so docs PRs are never blocked.
    # A PR on a narrow lane skips the matrix too and runs `lane-tests` instead (see header). The
    # test is `lane == 'full'`, not "not a narrow lane": a lane value this workflow does not know
    # must not fall through to "nothing runs".
    if: github.event_name != 'pull_request' || (needs.changes.outputs.nondocs == 'true' && needs.changes.outputs.lane == 'full')
    uses: ./.github/workflows/tests.yml
    with:
      tier: ${{ github.event_name == 'pull_request' && 'fast' || 'full' }}
      warnaserror: true
      nuget-cache: true
      duration-guardrail: ${{ github.event_name == 'pull_request' }}
      weight-drift-guard: ${{ github.event_name == 'pull_request' }}
      lane-filter-guard: ${{ github.event_name == 'pull_request' }}

  # Narrow test gate for PRs on a lane (see NARROW LANES in the header): builds the server test
  # project once and runs only the classes that can observe the lane's files. `verify` runs first so
  # a stale HAND_EXTRAS entry or a broken marker scan fails loudly instead of silently under-testing,
  # and the `ran` check afterwards refuses a run that executed no test (`dotnet test` exits 0 when a
  # filter matches nothing). Same Release + -warnaserror regime as the matrix; the fast-tier duration
  # guardrail is pointless here and needs the full trx picture, so it stays matrix-only.
  lane-tests:
    name: Lane guard tests
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.nondocs == 'true' && needs.changes.outputs.lane != 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 30 # the second net behind BLAME_HANG; a lane runs a few minutes
    steps:
      - uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: |
            **/*.csproj
            Directory.Build.props

      - name: Restore + build (treat warnings as errors)
        run: |
          dotnet restore tests/BlocksBeyondTheStars.Tests/BlocksBeyondTheStars.Tests.csproj
          dotnet build tests/BlocksBeyondTheStars.Tests/BlocksBeyondTheStars.Tests.csproj --no-restore -c Release -warnaserror

      # One `case` arm per lane detect-doc-only.yml can name. An unknown lane fails here — this job
      # stands in for the whole matrix, so "ran nothing" must never look like a pass.
      - name: Run lane guard tests
        env:
          LANE: ${{ needs.changes.outputs.lane }}
        run: |
          case "$LANE" in
            locales)
              python3 scripts/locale-test-filter.py verify
              FILTER="$(python3 scripts/locale-test-filter.py)"
              ;;
            whatsnew|client)
              python3 scripts/lane-test-filter.py "$LANE" verify
              FILTER="$(python3 scripts/lane-test-filter.py "$LANE")"
              ;;
            *)
              echo "::error::Unknown lane '$LANE' — add its filter to ci.yml's lane-tests job."
              exit 1
              ;;
          esac
          dotnet test tests/BlocksBeyondTheStars.Tests/BlocksBeyondTheStars.Tests.csproj --no-build -c Release --filter "Category!=Slow&$FILTER" --logger "trx;LogFileName=lane.trx" --results-directory TestResults $BLAME_HANG
          python3 scripts/lane-test-filter.py ran TestResults/lane.trx

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-results-lane
          path: |
            TestResults/*.trx
            TestResults/**/Sequence_*.xml
          if-no-files-found: ignore

  # The `client` lane's second half: the WHOLE Client.Tests suite (real NetworkClient against an
  # in-process GameServer, plus the source guards over the Unity scripts) — nothing is selected, so
  # nothing can be missed. On the matrix this suite rides on shard 1; here it gets its own runner so
  # it runs beside `lane-tests` instead of after it. Same tier filter as the PR matrix
  # (Category!=Slow), same Release + -warnaserror build, and the same refusal of an empty run.
  lane-client-tests:
    name: Lane guard tests (client suite)
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.lane == 'client'
    runs-on: ubuntu-latest
    timeout-minutes: 30 # the second net behind BLAME_HANG; the client suite runs a few minutes
    steps:
      - uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: |
            **/*.csproj
            Directory.Build.props

      - name: Restore + build (treat warnings as errors)
        run: |
          dotnet restore tests/BlocksBeyondTheStars.Client.Tests/BlocksBeyondTheStars.Client.Tests.csproj
          dotnet build tests/BlocksBeyondTheStars.Client.Tests/BlocksBeyondTheStars.Client.Tests.csproj --no-restore -c Release -warnaserror

      - name: Run the client suite
        run: |
          dotnet test tests/BlocksBeyondTheStars.Client.Tests/BlocksBeyondTheStars.Client.Tests.csproj --no-build -c Release --filter "Category!=Slow" --logger "trx;LogFileName=clientcore.trx" --results-directory TestResults $BLAME_HANG
          python3 scripts/lane-test-filter.py ran TestResults/clientcore.trx

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-results-lane-client
          path: |
            TestResults/*.trx
            TestResults/**/Sequence_*.xml
          if-no-files-found: ignore

  # Fan-in for branch protection: the ONE required check standing in for the whole test matrix.
  # Required checks must not point at matrix jobs directly (names carry the shard index, and a
  # docs-only PR would leave them "Expected — Waiting for status" forever). Passing states:
  # `changes` must have succeeded in every case, so a cancelled/failed upstream can't sneak through.
  # What counts as a pass then depends on the lane it named — each lane has exactly ONE passing
  # combination, so nothing passes vacuously (e.g. with every test job skipped):
  #   * full, or no lane at all (a push to main) → build-test == success: every shard green.
  #   * docs (the `changes` job said nondocs=false) → every test job skipped.
  #   * locales, whatsnew → lane-tests == success AND the matrix skipped.
  #   * client → lane-tests AND lane-client-tests == success AND the matrix skipped.
  #   * any other value fails: a lane detect-doc-only.yml learned without this job is not a pass.
  tests-passed:
    name: Tests passed
    needs: [changes, build-test, lane-tests, lane-client-tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check matrix result
        env:
          CHANGES: ${{ needs.changes.result }}
          MATRIX: ${{ needs.build-test.result }}
          LANE_TESTS: ${{ needs.lane-tests.result }}
          LANE_CLIENT: ${{ needs.lane-client-tests.result }}
          LANE: ${{ needs.changes.outputs.lane }}
        run: |
          echo "changes: $CHANGES / lane: '$LANE' / build-test: $MATRIX / lane-tests: $LANE_TESTS / lane-client-tests: $LANE_CLIENT"
          if [ "$CHANGES" != "success" ]; then exit 1; fi
          case "$LANE" in
            full|"")
              if [ "$MATRIX" != "success" ] || [ "$LANE_TESTS" != "skipped" ] || [ "$LANE_CLIENT" != "skipped" ]; then exit 1; fi
              ;;
            docs)
              if [ "$MATRIX" != "skipped" ] || [ "$LANE_TESTS" != "skipped" ] || [ "$LANE_CLIENT" != "skipped" ]; then exit 1; fi
              ;;
            locales|whatsnew)
              if [ "$LANE_TESTS" != "success" ] || [ "$MATRIX" != "skipped" ] || [ "$LANE_CLIENT" != "skipped" ]; then exit 1; fi
              ;;
            client)
              if [ "$LANE_TESTS" != "success" ] || [ "$LANE_CLIENT" != "success" ] || [ "$MATRIX" != "skipped" ]; then exit 1; fi
              ;;
            *)
              echo "::error::Unknown lane '$LANE'."
              exit 1
              ;;
          esac

  # Verifies C# code style/formatting (whitespace, using-order, object-initializer line breaks, …) per
  # .editorconfig. Runs against BlocksBeyondTheStars.CI.slnf, a solution filter listing every project EXCEPT
  # the Windows-only WinForms launcher, so the whole set loads on the Linux runner. Line endings are LF here
  # (.gitattributes eol=lf + .editorconfig end_of_line=lf agree), so the check is consistent on every fresh
  # checkout. Gated like build-test so docs-only PRs skip it (a skipped required job still counts as passing).
  format:
    name: Format (dotnet format)
    needs: changes
    # PRs on a data-only lane (locales, whatsnew) skip this too: dotnet format checks the C# projects
    # in CI.slnf, which cannot be affected by a diff of JSON data files (and a skipped required job
    # counts as a pass). The `client` lane keeps it: Client.Core and Client.Tests are in the solution.
    if: github.event_name != 'pull_request' || (needs.changes.outputs.nondocs == 'true' && (needs.changes.outputs.lane == 'full' || needs.changes.outputs.lane == 'client'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Same NuGet cache as build-test above — `dotnet format` restores the whole CI.slnf, so this job
      # pays a bigger restore than the test job does (#531).
      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: |
            **/*.csproj
            Directory.Build.props

      - name: dotnet format --verify-no-changes
        run: dotnet format BlocksBeyondTheStars.CI.slnf --verify-no-changes
