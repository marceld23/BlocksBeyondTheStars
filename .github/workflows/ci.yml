# Fast pull-request gate: builds the .NET projects and runs the headless xUnit suites.
#
# Triggered on every pull request and on direct pushes to main — NOT by tags (that is release.yml).
# This never touches Unity: it builds and tests only the two headless suites that run on Linux —
#   tests/BlocksBeyondTheStars.Tests        (.NET server/shared xUnit, no Unity)
#   tests/BlocksBeyondTheStars.Client.Tests (real NetworkClient vs in-process GameServer, no Unity/sockets)
# The Unity Edit/PlayMode suites need the editor and stay opt-in/local (see scripts/run-tests.ps1).
#
# TWO-TIER TEST GATE: pull requests run only the fast tier (--filter Category!=Slow); pushes to main run
# the full suite, and release.yml re-runs the full suite on the tagged commit before publishing anything.
# So a PR check stays fast, while every commit that lands on main — and every release — is still covered
# by all tests. Two things keep the fast tier fast (it once decayed from ~6 to ~15 min unnoticed):
#   * tests build/run in Release (worldgen/sim tests are CPU-bound and much faster than in Debug), and
#   * a duration guardrail (scripts/check-test-durations.py) fails a PR when any non-Slow test exceeds
#     its budget, so new heavies must either get the Slow trait or a real fix.
# See the Test step in tests.yml for details.
#
# SHARDED TEST MATRIX (#716): the server suite is CPU-bound and already scales ~perfectly with cores
# (at maxParallelThreads 4 on the 4-vCPU runner the summed test time IS the ~11 min wall the PR gate
# used to spend). More in-process threads would gain nothing (no more cores; xunit.runner.json pins 4
# because of the WorldGenerator lock convoy, #536) — so the suite fans out over 4 runners instead,
# cutting the test step to ~3 min. The matrix itself lives in the reusable .github/workflows/tests.yml
# (#1067) — shared with release.yml's gate, so the two cannot drift — and is called by `build-test`
# below with the tier/-warnaserror/guardrail settings this workflow wants. Branch protection requires
# the `tests-passed` fan-in job, NOT the matrix jobs (matrix job names carry the shard index and a
# skipped required matrix would not report).
#
# Warnings ARE enforced here: the build runs with -warnaserror so any analyzer/compiler warning fails
# the PR, even though the local build keeps TreatWarningsAsErrors=false (Directory.Build.props) for a
# friction-free dev loop. The tree currently builds clean (0 warnings), so this only guards regressions.
#
# REQUIRED-CHECK SAFE doc/screenshot-only skip: rather than skipping the whole workflow with paths-ignore
# (which would leave a *required* check stuck on "Expected — Waiting for status" for a docs-only PR), the
# workflow always runs and a `changes` job decides whether the heavy `build-test`/`format` jobs run. On a
# doc- or image-only PR the build-test shards are skipped via their `if:`, and the `tests-passed` fan-in
# explicitly treats "changes succeeded + build-test skipped" as a pass — so the required check reports
# green and never blocks a docs PR. Any code/content file in the diff makes them run for real. The
# doc/image skip list lives in the shared reusable workflow .github/workflows/detect-doc-only.yml (also
# used by lint.yml and codeql.yml). The `format` job stays a directly-required check (its name is stable
# and GitHub counts its skip as a pass, as before).
#
# LOCALES-ONLY NARROW GATE (#922): when the PR diff touches nothing but data/locales/*.json (a
# translation PR), the 4-shard matrix and `format` are skipped and the single `locale-tests` job runs
# the classes that can actually observe a locale edit (scripts/locale-test-filter.py: a marker scan
# for direct locale-table readers plus hand-listed indirect consumers, found by mutating every locale
# value and collecting the failing classes). `tests-passed` requires locale-tests' success in that
# case. Safety: an under-selected filter cannot reach a release — the push to main after merge runs
# the COMPLETE suite, and release.yml re-runs it on the tagged commit; the worst case is a red main.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the same PR/branch cancels the older still-running check.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decides whether the PR diff contains anything other than documentation or images. Always runs (no
  # job-level `if:`) so that on a push to main it succeeds and the downstream `needs: changes` is met;
  # the detection itself is PR-only (see the reusable workflow). `nondocs` is consumed by build-test/format.
  changes:
    uses: ./.github/workflows/detect-doc-only.yml

  # The sharded matrix (reusable tests.yml, see header). Two-tier gate: pull requests run only the fast
  # tier (--filter Category!=Slow, packed on the fast-tier weights) plus the duration guardrail; a push
  # to main runs the COMPLETE suite (tier full). Both build with -warnaserror; the NuGet cache is on
  # because this is the job a human waits on (#531). The job id stays `build-test` — `tests-passed`
  # reads `needs.build-test.result`.
  build-test:
    name: Build + test
    needs: changes
    # Run for any push to main, or for a PR that touched at least one non-doc file. A docs-only PR
    # skips this job; the `tests-passed` fan-in treats that as passing, so docs PRs are never blocked.
    # A locales-only PR skips the matrix too and runs `locale-tests` instead (see header).
    if: github.event_name != 'pull_request' || (needs.changes.outputs.nondocs == 'true' && needs.changes.outputs.localesonly != 'true')
    uses: ./.github/workflows/tests.yml
    with:
      tier: ${{ github.event_name == 'pull_request' && 'fast' || 'full' }}
      warnaserror: true
      nuget-cache: true
      duration-guardrail: ${{ github.event_name == 'pull_request' }}

  # Narrow test gate for locales-only PRs (see LOCALES-ONLY NARROW GATE in the header): builds the
  # server test project once and runs only the locale-consuming classes. `verify` runs first so a
  # stale HAND_EXTRAS entry or a broken marker scan fails loudly instead of silently under-testing.
  # Same Release + -warnaserror regime as the matrix; the fast-tier duration guardrail is pointless
  # here (the guards run in seconds) and needs the full trx picture, so it stays matrix-only.
  locale-tests:
    name: Locale guard tests
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.localesonly == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: |
            **/*.csproj
            Directory.Build.props

      - name: Restore + build (treat warnings as errors)
        run: |
          dotnet restore tests/BlocksBeyondTheStars.Tests/BlocksBeyondTheStars.Tests.csproj
          dotnet build tests/BlocksBeyondTheStars.Tests/BlocksBeyondTheStars.Tests.csproj --no-restore -c Release -warnaserror

      - name: Run locale guard tests
        run: |
          python3 scripts/locale-test-filter.py verify
          FILTER="$(python3 scripts/locale-test-filter.py)"
          dotnet test tests/BlocksBeyondTheStars.Tests/BlocksBeyondTheStars.Tests.csproj --no-build -c Release --filter "Category!=Slow&$FILTER" --logger "trx;LogFileName=locale.trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-results-locale
          path: TestResults/*.trx
          if-no-files-found: ignore

  # Fan-in for branch protection: the ONE required check standing in for the whole test matrix.
  # Required checks must not point at matrix jobs directly (names carry the shard index, and a
  # docs-only PR would leave them "Expected — Waiting for status" forever). Passing states:
  #   * build-test == success  → all four shards green
  #   * build-test == skipped  → docs-only PR (the `changes` job said nondocs=false) or locales-only
  #     PR (locale-tests ran instead) — counts as pass, but ONLY when `changes` itself succeeded, so
  #     a cancelled/failed upstream can't sneak through.
  #   * locale-tests is held to the same success-or-skipped bar, so a red locale guard blocks the PR.
  # Belt-and-braces: on a locales-only PR the matrix MUST be skipped and locale-tests MUST have run —
  # any other combination (e.g. both skipped) fails the fan-in rather than passing vacuously.
  tests-passed:
    name: Tests passed
    needs: [changes, build-test, locale-tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check matrix result
        run: |
          echo "changes: ${{ needs.changes.result }} / build-test: ${{ needs.build-test.result }} / locale-tests: ${{ needs.locale-tests.result }}"
          if [ "${{ needs.changes.result }}" != "success" ]; then exit 1; fi
          case "${{ needs.build-test.result }}" in
            success|skipped) ;;
            *) exit 1 ;;
          esac
          case "${{ needs.locale-tests.result }}" in
            success|skipped) ;;
            *) exit 1 ;;
          esac
          if [ "${{ needs.changes.outputs.localesonly }}" = "true" ]; then
            if [ "${{ needs.locale-tests.result }}" != "success" ] || [ "${{ needs.build-test.result }}" != "skipped" ]; then exit 1; fi
          fi

  # Verifies C# code style/formatting (whitespace, using-order, object-initializer line breaks, …) per
  # .editorconfig. Runs against BlocksBeyondTheStars.CI.slnf, a solution filter listing every project EXCEPT
  # the Windows-only WinForms launcher, so the whole set loads on the Linux runner. Line endings are LF here
  # (.gitattributes eol=lf + .editorconfig end_of_line=lf agree), so the check is consistent on every fresh
  # checkout. Gated like build-test so docs-only PRs skip it (a skipped required job still counts as passing).
  format:
    name: Format (dotnet format)
    needs: changes
    # Locales-only PRs skip this too: dotnet format checks the C# projects in CI.slnf, which cannot
    # be affected by a data/locales/*.json diff (and a skipped required job counts as a pass).
    if: github.event_name != 'pull_request' || (needs.changes.outputs.nondocs == 'true' && needs.changes.outputs.localesonly != 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Same NuGet cache as build-test above — `dotnet format` restores the whole CI.slnf, so this job
      # pays a bigger restore than the test job does (#531).
      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: |
            **/*.csproj
            Directory.Build.props

      - name: dotnet format --verify-no-changes
        run: dotnet format BlocksBeyondTheStars.CI.slnf --verify-no-changes
