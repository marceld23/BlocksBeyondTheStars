# WorldHost — the hosted-worlds control plane (docs/developer/HOSTED_WORLDS.md), fleet deployment.
# Interpolation values + secrets come from /opt/bbs/worldhost/.env on the host (see .env.example);
# deploy.yml syncs this file but NEVER touches the real .env.
#
# The service name doubles as the DNS alias on the bbs-hosted network — the caddy BaseCaddyfile's
# on-demand-TLS ask endpoint (http://worldhost:31417/ask) depends on it, so don't rename it.
services:
  worldhost:
    image: ghcr.io/marceld23/blocks-beyond-the-stars-worldhost:${WORLDHOST_TAG:-latest}
    container_name: bbs-worldhost
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1
    networks:
      - bbs-hosted
    volumes:
      # WorldHost drives the HOST docker daemon (one container per world) — root-equivalent by design.
      - /var/run/docker.sock:/var/run/docker.sock
      # Registry database (worldhost.db).
      - /opt/bbs/worldhost/data:/data
      # Per-world saves. MUST be the SAME absolute path inside and outside the container: WorldHost
      # passes <worlds>/<id>/saves to `docker run -v`, and the host daemon resolves that path on the
      # HOST filesystem (SavePaths.HostSavesDir).
      - /opt/bbs/worldhost/worlds:/opt/bbs/worldhost/worlds
      # Unity WebGL browser build served at /play (the portal's Play button deep-links into it).
      # Filled out-of-band: unzip a release webgl*.zip here (see deploy/README.md). Empty folder =
      # a friendly "not installed" page, never an error.
      - /opt/bbs/worldhost/webgl:/app/webgl:ro
    environment:
      BBS_WH_BIND: 0.0.0.0
      BBS_WH_DATA_DIR: /data
      BBS_WH_WEBGL_DIR: /app/webgl
      BBS_WH_WORLDS_DIR: /opt/bbs/worldhost/worlds
      BBS_WH_DOCKER_NETWORK: bbs-hosted
      BBS_WH_BASE_DOMAIN: ${BBS_WH_BASE_DOMAIN:?set in /opt/bbs/worldhost/.env}
      BBS_WH_PUBLIC_HOST: ${BBS_WH_PUBLIC_HOST:?set in /opt/bbs/worldhost/.env}
      BBS_WH_SERVER_IMAGE: ${BBS_WH_SERVER_IMAGE:?set in /opt/bbs/worldhost/.env}
      BBS_WH_RESERVED_CLAIM_CODE: ${BBS_WH_RESERVED_CLAIM_CODE:-}   # empty = reserved names unclaimable
      BBS_WH_ADMIN_TOKEN: ${BBS_WH_ADMIN_TOKEN:-}                   # empty = admin API off
      # Maintenance announcements (#249): shared secret forwarded to each world as BBS_ANNOUNCE_TOKEN;
      # worlds only pick it up on their next wake. Empty = announcements off.
      BBS_WH_ANNOUNCE_TOKEN: ${BBS_WH_ANNOUNCE_TOKEN:-}
      # Server crash reports (#363): the ReportHost write key, forwarded to each world as
      # BBS_CRASH_REPORT_KEY (picked up on the next wake). Empty = crash upload off. The endpoint
      # override is only for fleets with their own ReportHost — the server default is the official inbox.
      BBS_WH_CRASH_REPORT_KEY: ${BBS_WH_CRASH_REPORT_KEY:-}
      BBS_WH_CRASH_REPORT_ENDPOINT: ${BBS_WH_CRASH_REPORT_ENDPOINT:-}
      # Per-tick chunk-stream budget (ms) forwarded to every world as BBS_CHUNK_STREAM_BUDGET_MS (#360):
      # bounds cold-worldgen bursts so one player's fresh join/fast-flight can't stall the world's tick for
      # everyone else. Default 25 (generous headroom under the ~66 ms tick); 0 = off (unbounded).
      BBS_WH_CHUNK_STREAM_BUDGET_MS: ${BBS_WH_CHUNK_STREAM_BUDGET_MS:-25}
      # Portal → game website link (footer + landing page). Unset keeps WorldHost's built-in default
      # (the project's own site); "-" drops the link, which is what a self-hoster wants.
      BBS_WH_WEBSITE_URL: ${BBS_WH_WEBSITE_URL:-}
      BBS_WH_WEBSITE_URL_EN: ${BBS_WH_WEBSITE_URL_EN:-}
      # Legal pages (Impressum/Datenschutz); empty = "not configured" notice on those pages.
      BBS_WH_LEGAL_NAME: ${BBS_WH_LEGAL_NAME:-}
      BBS_WH_LEGAL_ADDRESS: ${BBS_WH_LEGAL_ADDRESS:-}
      BBS_WH_LEGAL_EMAIL: ${BBS_WH_LEGAL_EMAIL:-}
      # Admin web UI (/admin) — Basic Auth; empty = off.
      BBS_WH_ADMIN_USER: ${BBS_WH_ADMIN_USER:-}
      BBS_WH_ADMIN_PASSWORD: ${BBS_WH_ADMIN_PASSWORD:-}
      # WorldHost runs IN a container here: its loopback can never reach host-published ports, so
      # /status probes must go to the world containers by name on the shared docker network. REQUIRED.
      BBS_WH_PROBE_VIA_NETWORK: "true"
      # Fleet AI texts (optional): world instances call the internal-only ai container by name.
      BBS_WH_AI_BACKEND_URL: ${BBS_WH_AI_BACKEND_URL:-}   # empty = AI off; fleet: http://ai:8077
      BBS_WH_AI_LEVEL: ${BBS_WH_AI_LEVEL:-TextOnly}
      # Per-world resource fences + the fleet-wide awake cap (see WorldHostConfig for semantics).
      BBS_WH_INSTANCE_MEMORY: ${BBS_WH_INSTANCE_MEMORY:-768m}
      BBS_WH_INSTANCE_CPUS: ${BBS_WH_INSTANCE_CPUS:-2}
      BBS_WH_MAX_ACTIVE: ${BBS_WH_MAX_ACTIVE:-10}
      # X-Forwarded-For trust (#418): empty keeps the built-in default (loopback + private ranges —
      # covers the sibling Caddy container); set exact IPs/CIDRs to tighten, `none` to disable.
      BBS_WH_TRUSTED_PROXIES: ${BBS_WH_TRUSTED_PROXIES:-}
      BBS_WH_LOGIN_FAILS_PER_15_MIN: ${BBS_WH_LOGIN_FAILS_PER_15_MIN:-}
      # glitch.fun arcade gateway (v0.8.0): off without the title credentials. The title token is
      # server-side only by design — it never ships inside the WebGL build.
      BBS_WH_GLITCH_ENABLED: ${BBS_WH_GLITCH_ENABLED:-false}
      BBS_WH_GLITCH_TITLE_ID: ${BBS_WH_GLITCH_TITLE_ID:-}
      BBS_WH_GLITCH_TITLE_TOKEN: ${BBS_WH_GLITCH_TITLE_TOKEN:-}
      BBS_WH_GLITCH_WORLDS: ${BBS_WH_GLITCH_WORLDS:-2}
      BBS_WH_GLITCH_MAX_PLAYERS: ${BBS_WH_GLITCH_MAX_PLAYERS:-8}
      BBS_WH_GLITCH_ALLOWED_ORIGINS: ${BBS_WH_GLITCH_ALLOWED_ORIGINS:-}
      BBS_WH_GLITCH_SAVES_PER_HOUR: ${BBS_WH_GLITCH_SAVES_PER_HOUR:-40}
    labels:
      # Portal + API domain. Worlds announce their own w-<id> subdomains via labels WorldHost puts on
      # each instance container.
      caddy: ${BBS_WH_BASE_DOMAIN:?set in /opt/bbs/worldhost/.env}
      caddy.reverse_proxy: "{{upstreams 31417}}"

networks:
  bbs-hosted:
    external: true
